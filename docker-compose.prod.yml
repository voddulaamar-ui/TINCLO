# ── TINCLO — Docker Compose (Production) ──────────────────────────────────────
version: '3.9'

services:
  backend:
    image: tinclo/backend:latest
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
    env_file: ./backend/.env
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5002/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    image: tinclo/frontend:latest
    ports:
      - "80:80"
      - "443:443"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod:/data
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    image: tinclo/backend:latest
    command: node workers/index.js
    env_file: ./backend/.env
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  redis_prod:
